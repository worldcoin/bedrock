version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # Matches registry.global-min-publish-age in .cargo/config.toml.
    cooldown:
      default-days: 7
    assignees:
      - "paolodamico"
      - "aurel-fr"
    ignore:
      - dependency-name: "uniffi"
