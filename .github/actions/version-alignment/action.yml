name: Version Alignment
description: Checks uniffi against org CI variables

inputs:
  uniffi_version:
    description: Expected uniffi version (from UNIFFI_VERSION CI variable)
    required: true

runs:
  using: composite
  steps:
    - name: Check uniffi version matches CI variable
      env:
        EXPECTED_VERSION: ${{ inputs.uniffi_version }}
      run: |
        python3 ${{ github.action_path }}/check_uniffi_version.py \
          --expected-version "$EXPECTED_VERSION"
      shell: bash
